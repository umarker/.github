name: Bug
description: Something is broken
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Click …\n3. See …"
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: page URL, browser, language (AR/EN), light/dark
