name: Feature
description: A new capability or improvement
labels: ["type: feature"]
body:
  - type: textarea
    id: why
    attributes:
      label: Problem
      description: Who needs this and why.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Proposal
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] …"
